name: Deploy Demo Pages

on:
  workflow_dispatch:

concurrency:
  group: demo-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  deploy:
    name: Deploy demo entry page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify deployment source branch
        shell: bash
        run: |
          set -euo pipefail

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Demo Pages must be deployed from main. Current ref: ${GITHUB_REF}."
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site/yamabiko-table-reorder
          cp demo/index.html _site/yamabiko-table-reorder/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
