name: Issue 928 architecture update

on:
  push:
    branches:
      - docs/928-reorder-apply-architecture

permissions:
  contents: write

jobs:
  update-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/928-reorder-apply-architecture
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch temporary transformation wording
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('.github/issue-928-update.py')
          text = p.read_text(encoding='utf-8')
          old = """    direct_sentence = (\n        f'DnD InteractionはDestination Resolutionで解決済みの論理{axis}間境界をSession開始時制約へ照合し、有効な移動先だけを意味状態として保持する。'\n        f'`complete`では現在構造へ再照合し、成立する場合だけTable Integrationへ{axis}移動を要求する。'\n    )\n"""
          new = """    direct_move_label = 'Table全体の列' if direction == 'Column' else axis\n    direct_sentence = (\n        f'DnD InteractionはDestination Resolutionで解決済みの論理{axis}間境界をSession開始時制約へ照合し、有効な移動先だけを意味状態として保持する。'\n        f'`complete`では現在構造へ再照合し、成立する場合だけTable Integrationへ{direct_move_label}移動を要求する。'\n    )\n"""
          if old not in text:
              raise RuntimeError('temporary transformation patch anchor not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Update architecture Markdown
        run: python .github/issue-928-update.py

      - name: Install dependencies
        run: npm ci

      - name: Generate Structurizr DSL from Markdown
        run: |
          npm run architecture:generate -- docs/architecture/row-reorder-v1-architecture.md
          npm run architecture:generate -- docs/architecture/column-reorder-v1-architecture.md

      - name: Commit architecture update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/row-reorder-v1-architecture.md \
                  docs/architecture/column-reorder-v1-architecture.md \
                  docs/architecture/row-reorder-v1-architecture.dsl \
                  docs/architecture/column-reorder-v1-architecture.dsl
          git commit -m "docs: align reorder apply architecture"
          git push origin HEAD:docs/928-reorder-apply-architecture

      - name: Remove temporary files
        run: |
          git rm .github/workflows/issue-928-apply-architecture.yml .github/issue-928-update.py
          git commit -m "chore: remove temporary issue 928 tooling"
          git push origin HEAD:docs/928-reorder-apply-architecture
