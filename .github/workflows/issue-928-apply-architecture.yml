name: Issue 928 architecture update

on:
  push:
    branches:
      - docs/928-reorder-apply-architecture
    paths:
      - .github/workflows/issue-928-apply-architecture.yml

permissions:
  contents: write

jobs:
  update-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/928-reorder-apply-architecture
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update architecture Markdown
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one occurrence, found {count}')
              return text.replace(old, new, 1)

          def replace_regex_once(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one regex match, found {count}')
              return updated

          def update_document(path: str, *, direction: str, lower: str, axis: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')

              d = direction.upper()
              policy_id = 'RESP_REORDER_APPLY_POLICY'
              apply_id = f'RESP_{d}_REORDER_APPLY'
              dnd_id = f'RESP_{d}_DND_INTERACTION'
              table_id = f'RESP_{d}_TABLE_INTEGRATION'
              presentation_id = f'RESP_{d}_PRESENTATION'
              engine_id = f'RESP_{d}_DND_ENGINE_INTEGRATION'
              boundary_id = f'BOUNDARY_{d}_REORDER'
              wp_apply_id = 'RESP_WORDPRESS_REORDER_APPLY_INTEGRATION'
              view_prefix = d

              # Architecture constraints
              anchor = '- WordPress Reorder IntegrationはTableツールバー入口、通常編集抑止、現在TableとReorder Modeの接続、および'
              constraint_line = next(line for line in text.splitlines() if line.startswith(anchor))
              added_constraints = constraint_line + '\n' + (
                  '- Reorder Apply PolicyはRow / Column共通の反映経路選択だけを所有し、Table構造や方向固有の移動意味、反映Lifecycleを所有しない。\n'
                  '- WordPress Reorder Apply Integrationは確認付き大規模反映のEditor表示接続とediting surface restorationを所有し、通常のReorder Mode / DnD接続を所有しない。\n'
                  f'- {direction} Reorder Applyは確認付き大規模反映の方向固有Lifecycleと確定済み{axis}移動意図だけを所有し、DnD Sessionとは独立して状態を管理する。'
              )
              text = replace_once(text, constraint_line, added_constraints, f'{path}: constraints')

              # Solution strategy: replace the direct-only complete description with route selection.
              direct_sentence = (
                  f'DnD InteractionはDestination Resolutionで解決済みの論理{axis}間境界をSession開始時制約へ照合し、有効な移動先だけを意味状態として保持する。'
                  f'`complete`では現在構造へ再照合し、成立する場合だけTable Integrationへ{axis}移動を要求する。'
              )
              solution = (
                  f'DnD InteractionはDestination Resolutionで解決済みの論理{axis}間境界をSession開始時制約へ照合し、有効な移動先だけを意味状態として保持する。'
                  f'`complete`では現在構造へ再照合し、成立する場合はTable Integrationから更新対象セル数を取得してReorder Apply Policyへ反映経路の選択を要求する。'
                  f'通常反映ではTable Integrationへ確定済み{axis}移動を要求し、確認付き大規模反映ではDnD Sessionを終了してから{direction} Reorder Applyへ確定済み移動意図を引き渡す。\n\n'
                  f'{direction} Reorder Applyは`confirming`以降の方向固有Lifecycleを所有する。確認中はTableを変更せず、Continue後の反映開始時に現在構造をTable Integrationへ再照合し、現在も成立する場合だけ確定済み{axis}移動を要求する。Cancelまたは再照合不成立ではTableを変更しない。\n\n'
                  'WordPress Reorder Apply IntegrationはRow / ColumnのReorder Apply状態をWordPress Editor表示へ接続する。重いTable更新より先に対象Tableの通常編集表示を一時的に退避して反映中表示を成立させ、更新後の編集表示が再成立した後に方向固有Reorder Apply Lifecycleを完了する。'
              )
              text = replace_once(text, direct_sentence, solution, f'{path}: solution strategy')

              # Add a dedicated large-apply Process Flow View before recovery.
              recovery_heading = f'#### External Environment Change and Recovery {{#PV_{d}_EXTERNAL_CHANGE_RECOVERY kind=failure-recovery}}'
              large_flow = f'''#### Large {direction} Reorder Apply {{#PV_{d}_LARGE_REORDER_APPLY kind=normal}}

DnD complete後に更新対象セル数から確認付き大規模反映へ分岐し、DnD Session終了後の方向固有Apply Lifecycle、WordPress表示接続、現在Table再照合、確定更新へ進む主要な処理方向を示す。Process Flowの行順はRuntime順序を定義しない。

| From | To | Kind | Meaning |
| --- | --- | --- | --- |
| {dnd_id} | {policy_id} | normal | Table Integrationが算出した更新対象セル数から反映経路の選択へ進む。 |
| {dnd_id} | {apply_id} | normal | 確認付き大規模反映ではDnD Session終了後に確定済み移動意図を方向固有Apply Lifecycleへ引き渡す。 |
| {apply_id} | {wp_apply_id} | normal | 方向固有Apply状態をWordPress Editorの確認・反映中・表示復帰へ接続する。 |
| {wp_apply_id} | EXT_WORDPRESS_EDITOR | normal | 確認UI、反映中表示、更新後の編集表示をWordPress Editor上に成立させる。 |
| {apply_id} | {table_id} | normal | Continue後に現在構造を再照合し、成立する場合だけ確定済み{axis}移動を要求する。 |
| {table_id} | EXT_SUPPORTED_TABLE_BLOCK | normal | 現在構造を取得し、成立した確定移動だけを対応Tableへ反映する。 |
| {table_id} | EXT_WORDPRESS_UNDO | normal | 成立した1回の{axis}移動を1回のUndo単位として成立させる。 |

'''
              text = replace_once(text, recovery_heading, large_flow + recovery_heading, f'{path}: process flow')

              # Responsibility inventory.
              guidance_row = '| RESP_REORDER_GUIDANCE | Reorder Guidance | 現在どのTableへどの操作環境の共通入口案内を表示しているかという一時状態だけを所有する共通状態責務。 |'
              policy_row = '| RESP_REORDER_APPLY_POLICY | Reorder Apply Policy | Table Integrationが算出した更新対象セル数だけから通常反映か確認付き大規模反映かを選択する共通方針責務。 |'
              text = replace_once(text, guidance_row, guidance_row + '\n' + policy_row, f'{path}: policy inventory')

              wp_row_prefix = '| RESP_WORDPRESS_REORDER_INTEGRATION | WordPress Reorder Integration |'
              wp_row = next(line for line in text.splitlines() if line.startswith(wp_row_prefix))
              wp_apply_row = '| RESP_WORDPRESS_REORDER_APPLY_INTEGRATION | WordPress Reorder Apply Integration | 方向固有Reorder Apply状態をWordPress Editorの確認、反映中表示、editing surface restorationへ接続する。 |'
              text = replace_once(text, wp_row, wp_row + '\n' + wp_apply_row, f'{path}: wp apply inventory')

              dnd_row_prefix = f'| {dnd_id} | DnD Interaction |'
              dnd_row = next(line for line in text.splitlines() if line.startswith(dnd_row_prefix))
              apply_row = f'| {apply_id} | Reorder Apply | DnD Session終了後の確認付き大規模反映について、確定済み{axis}移動意図、確認、反映開始、現在構造再照合、表示復帰完了までの方向固有Lifecycleを所有する。 |'
              text = replace_once(text, dnd_row, dnd_row + '\n' + apply_row, f'{path}: directional apply inventory')

              # Ownership boundaries.
              common_boundary = '| BOUNDARY_REORDER_COMMON | Reorder Common | RESP_REORDER_MODE RESP_REORDER_GUIDANCE |'
              text = replace_once(text, common_boundary, '| BOUNDARY_REORDER_COMMON | Reorder Common | RESP_REORDER_MODE RESP_REORDER_GUIDANCE RESP_REORDER_APPLY_POLICY |', f'{path}: common boundary')

              wp_boundary_prefix = '| BOUNDARY_WORDPRESS_REORDER | WordPress Reorder Integration |'
              wp_boundary = next(line for line in text.splitlines() if line.startswith(wp_boundary_prefix))
              wp_boundary_new = wp_boundary[:-2] + f' {wp_apply_id} |'
              text = replace_once(text, wp_boundary, wp_boundary_new, f'{path}: wp boundary')

              direction_boundary_prefix = f'| {boundary_id} | {direction} Reorder |'
              direction_boundary = next(line for line in text.splitlines() if line.startswith(direction_boundary_prefix))
              direction_boundary_new = direction_boundary[:-2] + f' {apply_id} |'
              text = replace_once(text, direction_boundary, direction_boundary_new, f'{path}: direction boundary')

              # Structural dependencies.
              wp_engine_dep_prefix = f'| RESP_WORDPRESS_REORDER_INTEGRATION | {engine_id} |'
              wp_engine_dep = next(line for line in text.splitlines() if line.startswith(wp_engine_dep_prefix))
              wp_apply_deps = (
                  f'{wp_engine_dep}\n'
                  f'| {wp_apply_id} | EXT_WORDPRESS_EDITOR | 確認UI、反映中表示、更新後の編集表示をWordPress Editorへ接続するために必要とする。 |\n'
                  f'| {wp_apply_id} | {apply_id} | 方向固有の確認付き大規模反映状態をEditor表示へ接続し、Continue / Cancel / 表示復帰完了をLifecycleへ返すために必要とする。 |'
              )
              text = replace_once(text, wp_engine_dep, wp_apply_deps, f'{path}: wp apply dependencies')

              dnd_table_dep_prefix = f'| {dnd_id} | {table_id} |'
              dnd_table_dep = next(line for line in text.splitlines() if line.startswith(dnd_table_dep_prefix))
              apply_deps = (
                  f'{dnd_table_dep}\n'
                  f'| {dnd_id} | {policy_id} | 更新対象セル数から通常反映か確認付き大規模反映かを選択するために必要とする。 |\n'
                  f'| {dnd_id} | {apply_id} | 確認付き大規模反映ではDnD Session終了後に確定済み移動意図を方向固有Apply Lifecycleへ引き渡すために必要とする。 |\n'
                  f'| {apply_id} | {table_id} | Continue後の現在構造再照合、更新対象の成立確認、確定済み{axis}移動の反映に必要とする。 |'
              )
              text = replace_once(text, dnd_table_dep, apply_deps, f'{path}: apply dependencies')

              # Dependency views: include new responsibilities only where they carry the view meaning.
              resp_view_prefix = f'| DV_{view_prefix}_RESPONSIBILITY | Responsibility View |'
              resp_view = next(line for line in text.splitlines() if line.startswith(resp_view_prefix))
              resp_view_new = resp_view[:-2] + f' {policy_id} {wp_apply_id} {apply_id} |'
              text = replace_once(text, resp_view, resp_view_new, f'{path}: responsibility view')

              editor_view_prefix = f'| DV_{view_prefix}_EDITOR_INTEGRATION | Editor Integration |'
              editor_view = next(line for line in text.splitlines() if line.startswith(editor_view_prefix))
              editor_view_new = editor_view[:-2] + f' {wp_apply_id} {apply_id} |'
              text = replace_once(text, editor_view, editor_view_new, f'{path}: editor view')

              dnd_view_prefix = f'| DV_{view_prefix}_DND_CORE | DnD Core |'
              dnd_view = next(line for line in text.splitlines() if line.startswith(dnd_view_prefix))
              dnd_view_new = dnd_view[:-2] + f' {policy_id} {apply_id} |'
              text = replace_once(text, dnd_view, dnd_view_new, f'{path}: dnd view')

              data_view_prefix = f'| DV_{view_prefix}_DATA_UPDATE | Table Update |'
              data_view = next(line for line in text.splitlines() if line.startswith(data_view_prefix))
              data_view_new = data_view[:-2] + f' {policy_id} {apply_id} {wp_apply_id} |'
              text = replace_once(text, data_view, data_view_new, f'{path}: data update view')

              # Responsibility details: common policy before Editor DOM Context.
              editor_heading = '#### Editor DOM Context {#RESP_EDITOR_DOM_CONTEXT}'
              policy_details = f'''#### Reorder Apply Policy {{#{policy_id}}}

##### Responsibility

Row / Columnに共通する反映経路選択として、Table Integrationが算出した今回の更新対象セル数だけから通常反映または確認付き大規模反映のどちらを利用するかを判断する。

##### State ownership

状態を所有しない。Table構造、移動元・移動先、方向固有Apply Lifecycle、WordPress表示状態を保持しない。

##### Contract

呼び出し側から更新対象セル数を受け、共通の性能上のPolicyに従って通常反映または確認付き大規模反映を返す。Table構造や{axis}移動の意味を解釈しない。

##### Lifecycle

DnD completeで現在構造の再照合と更新対象セル数の算出が成立した後に、その1回の確定候補について同期的に経路を選択する。選択結果を次の操作へ持ち越さない。

##### Invariants

- Row / Column固有の移動意味を所有しない。
- 方向固有Reorder Apply状態を所有しない。
- Table Integrationが算出していない値から更新範囲を推測しない。
- 閾値を利用者向け固定要件として扱わない。

'''
              text = replace_once(text, editor_heading, policy_details + editor_heading, f'{path}: policy details')

              # WordPress apply integration before guidance integration.
              guidance_integration_heading = '#### Reorder Guidance Integration {#RESP_REORDER_GUIDANCE_INTEGRATION}'
              wp_apply_details = f'''#### WordPress Reorder Apply Integration {{#{wp_apply_id}}}

##### Responsibility

Row / Columnの方向固有Reorder Apply状態をWordPress Editorの確認UI、反映中表示、および更新後のediting surface restorationへ接続する。

##### State ownership

WordPress表示接続に必要な一時状態だけを扱い、方向固有Reorder Apply状態、確定済み移動意図、Table制約、Reorder Modeを別正本として所有しない。

##### Contract

`confirming`では対象Tableの通常編集表示を維持したまま確認UIを提示し、Continue / Cancelを方向固有Reorder Applyへ返す。`applying`では重いTable更新より先に対象Tableの通常編集表示を一時的に退避して反映中表示を成立させる。方向固有Reorder Applyの更新処理が終わった後は更新後のTable編集表示を再成立させ、表示復帰完了を方向固有Lifecycleへ返す。

##### Lifecycle

方向固有Reorder Applyがidle以外の期間だけApply表示接続を成立させる。確認、反映中表示、更新後の編集表示再成立を経て、表示復帰完了後に方向固有Reorder Applyをidleへ完了させる。

##### Invariants

- Row / Column固有の移動意味やTable制約判定を所有しない。
- 通常のReorder Mode / DnD接続を既存WordPress Reorder Integrationから奪わない。
- 確認UIや表示復帰だけでTableデータ更新またはUndo履歴を追加しない。
- React固有のmount / unmount方式をArchitecture契約にしない。

'''
              text = replace_once(text, guidance_integration_heading, wp_apply_details + guidance_integration_heading, f'{path}: wp apply details')

              # Table Integration now also owns affected-cell-count calculation for a confirmed candidate.
              table_pattern = rf'(#### Table Integration \{{#{table_id}\}}.*?##### Contract\n\n)(.*?)(\n\n##### Lifecycle)'
              def table_repl(match: re.Match[str]) -> str:
                  contract = match.group(2)
                  addition = (
                      f'\n\n確定候補となる{axis}移動を受け、要求時点のTable構造から今回の更新対象セル数を算出して返す。'
                      '安全に算出できない場合は反映経路を推測させず利用不能結果を返す。'
                  )
                  return match.group(1) + contract + addition + match.group(3)
              text, count = re.subn(table_pattern, table_repl, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{path}: table integration contract not found')

              # DnD Interaction contract and lifecycle route selection.
              dnd_pattern = rf'(#### DnD Interaction \{{#{dnd_id}\}}.*?##### Contract\n\n)(.*?)(\n\n##### Lifecycle)'
              def dnd_repl(match: re.Match[str]) -> str:
                  contract = match.group(2)
                  needle = f'`cancel`または有効移動先のないdropはTableを更新せず正常終了する。'
                  addition = (
                      f'現在構造で確定候補が成立した場合は、Table Integrationから今回の更新対象セル数を取得し、Reorder Apply Policyで反映経路を選択する。'
                      f'通常反映ではTable Integrationへ確定済み{axis}移動を要求する。確認付き大規模反映ではTableをまだ更新せず、DnD Sessionをidleへ終了した後に確定済み移動意図を{direction} Reorder Applyへ引き渡す。\n\n'
                  )
                  if needle not in contract:
                      raise RuntimeError(f'{path}: DnD cancel contract anchor not found')
                  contract = contract.replace(needle, addition + needle, 1)
                  return match.group(1) + contract + match.group(3)
              text, count = re.subn(dnd_pattern, dnd_repl, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f'{path}: dnd interaction contract not found')

              # Direction-specific Reorder Apply responsibility before Presentation.
              presentation_heading = f'#### Reorder Presentation {{#{presentation_id}}}'
              apply_details = f'''#### Reorder Apply {{#{apply_id}}}

##### Responsibility

確認付き大規模反映について、DnD Session終了後に受理した確定済み{axis}移動意図、利用者確認、反映開始、現在構造再照合、editing surface restoration完了までの方向固有Lifecycleを所有する。

##### State ownership

idleでは移動意図を持たず、確認付き反映中だけ一つの確定済み{axis}移動意図と現在のLifecycle状態を所有する。DnD Session、WordPress表示状態、Table制約のsnapshotを重複所有しない。

##### Contract

DnD Session終了後に確認付き大規模反映の移動意図を一つだけ受理して`confirming`へ進む。CancelではTableを変更せずidleへ戻る。Continueでは反映開始状態へ進み、WordPress Reorder Apply Integrationが反映中表示を成立させた後、Table Integrationから現在構造を再取得して移動元・移動先を再照合する。現在も成立する場合だけ確定済み{axis}移動を要求し、成立しない場合はTableを変更しない。更新成否にかかわらずediting surface restorationを経て、その表示復帰完了後にidleへ戻る。

##### Lifecycle

`idle → confirming → applying → editing surface restoration → idle`をArchitecture上の意味として持つ。Cancelは`confirming → idle`、確認後の再照合不成立はTableを変更せず`applying → editing surface restoration → idle`へ進む。一つの確認付き反映が完了するまで別の同方向大規模反映要求を受理しない。

##### Invariants

- `confirming`は物理drag-end処理中ではなくDnD Session終了後に公開する。
- 確認中はTableデータを変更しない。
- Continue後も現在構造への再照合なしに確定しない。
- 再照合不成立ではTableを変更しない。
- 成立した1回の{axis}移動を複数のWordPress更新またはUndo単位へ分割しない。
- WordPress Editor表示の実装方式を所有しない。

'''
              text = replace_once(text, presentation_heading, apply_details + presentation_heading, f'{path}: apply details')

              # Runtime direct complete scenario is now explicitly the direct path.
              cancel_heading = f'### {direction} DnD cancel or invalid drop {{#RV_{d}_DND_CANCEL}}'
              complete_pattern = rf'### {re.escape(direction)} DnD complete \{{#RV_{d}_DND_COMPLETE\}}.*?(?={re.escape(cancel_heading)})'
              direct_runtime = f'''### {direction} DnD complete {{#RV_{d}_DND_COMPLETE}}

物理DnD終了後に現在Tableへ再照合し、更新対象セル数をReorder Apply Policyへ渡す。通常反映と判定された場合だけ、このRuntime内で確定済み{axis}移動を一回で更新する。

| Step | Source | Target | Interaction |
| ---: | --- | --- | --- |
| 1 | EXT_DND_ENGINE | {engine_id} | cancelされていない物理DnD endを通知する。 |
| 2 | {engine_id} | {dnd_id} | active Sessionのcompleteを要求する。 |
| 3 | {dnd_id} | {table_id} | 現在の{axis}制約を要求する。 |
| 4 | {table_id} | EXT_SUPPORTED_TABLE_BLOCK | 要求時点の対応Tableから現在{axis}制約を取得する。 |
| 5 | {table_id} | {dnd_id} | 現在{axis}制約または利用不能結果を返す。 |
| 6 | {dnd_id} | {table_id} | 現在も移動元と移動先が成立する確定候補について更新対象セル数を要求する。 |
| 7 | {table_id} | {dnd_id} | 更新対象セル数または利用不能結果を返す。 |
| 8 | {dnd_id} | {policy_id} | 更新対象セル数から反映経路の選択を要求する。 |
| 9 | {policy_id} | {dnd_id} | 通常反映または確認付き大規模反映を返す。 |
| 10 | {dnd_id} | {table_id} | 通常反映の場合だけ確定済み{axis}移動を要求する。 |
| 11 | {table_id} | EXT_SUPPORTED_TABLE_BLOCK | {axis}順を一回の更新として反映する。 |
| 12 | {table_id} | EXT_WORDPRESS_UNDO | 成立した{axis}移動を一回のUndo単位として成立させる。 |
| 13 | {dnd_id} | {presentation_id} | DnD Session終了を表示購読へ反映する。 |
| 14 | {dnd_id} | {table_id} | Session破棄後、対象Tableが次の{lower}並び替えを安全に受けられるか現在状態を取得し直す。 |
| 15 | {dnd_id} | RESP_REORDER_MODE | 対象Tableの継続可否だけを現在モードへ反映する。 |

確認付き大規模反映と判定された場合、Step 10から12は実行せず、DnD Sessionを終了した後に`RV_{d}_LARGE_REORDER_CONFIRM`へ進む。

'''
              text = replace_regex_once(text, complete_pattern, direct_runtime, f'{path}: direct runtime')

              # Large apply runtime scenarios.
              large_runtime = f'''### {direction} large reorder confirmation {{#RV_{d}_LARGE_REORDER_CONFIRM}}

Reorder Apply Policyが確認付き大規模反映を選択した場合、物理DnDの表示とSessionを先に終了し、その後に方向固有Reorder Applyが確定済み移動意図を受理して確認状態を公開する。

| Step | Source | Target | Interaction |
| ---: | --- | --- | --- |
| 1 | {dnd_id} | {presentation_id} | DnD Session終了を表示購読へ反映し、物理DnD表示を終了する。 |
| 2 | {dnd_id} | {table_id} | Session破棄後の対象Table利用可否を取得し直す。 |
| 3 | {dnd_id} | RESP_REORDER_MODE | 対象Tableの継続可否だけを現在モードへ反映する。 |
| 4 | {dnd_id} | {apply_id} | DnD Session終了後に確定済み{axis}移動意図を確認付き大規模反映として引き渡す。 |
| 5 | {apply_id} | {wp_apply_id} | `confirming`状態をWordPress表示接続へ公開する。 |
| 6 | {wp_apply_id} | EXT_WORDPRESS_EDITOR | 対象Tableの通常編集表示を維持したまま確認UIを表示する。 |

### {direction} large reorder continue {{#RV_{d}_LARGE_REORDER_CONTINUE}}

利用者がContinueした後、反映中表示を先に成立させ、方向固有Reorder Applyが現在Tableを再照合して成立する場合だけ確定更新し、更新後の編集表示が再成立してからLifecycleを完了する。

| Step | Source | Target | Interaction |
| ---: | --- | --- | --- |
| 1 | EXT_WORDPRESS_EDITOR | {wp_apply_id} | 利用者が確認UIでContinueを選択する。 |
| 2 | {wp_apply_id} | {apply_id} | 確認待ちの移動意図を反映開始へ進める。 |
| 3 | {apply_id} | {wp_apply_id} | `applying`状態をWordPress表示接続へ公開する。 |
| 4 | {wp_apply_id} | EXT_WORDPRESS_EDITOR | 対象Tableの通常編集表示を一時的に退避し、反映中表示を先に成立させる。 |
| 5 | {wp_apply_id} | {apply_id} | 反映中表示成立後に確定処理を進める。 |
| 6 | {apply_id} | {table_id} | 現在の{axis}制約を取得し、保持中の移動元・移動先を再照合する。 |
| 7 | {table_id} | EXT_SUPPORTED_TABLE_BLOCK | 要求時点の対応Tableから現在{axis}制約を取得する。 |
| 8 | {table_id} | {apply_id} | 現在{axis}制約または利用不能結果を返す。 |
| 9 | {apply_id} | {table_id} | 現在も成立する場合だけ確定済み{axis}移動を要求する。 |
| 10 | {table_id} | EXT_SUPPORTED_TABLE_BLOCK | {axis}順を一回の更新として反映する。 |
| 11 | {table_id} | EXT_WORDPRESS_UNDO | 成立した{axis}移動を一回のUndo単位として成立させる。 |
| 12 | {apply_id} | {wp_apply_id} | Table更新後にediting surface restorationへ進んだことを公開する。 |
| 13 | {wp_apply_id} | EXT_WORDPRESS_EDITOR | 更新後のTable編集表示を再成立させる。 |
| 14 | {wp_apply_id} | {apply_id} | 表示復帰完了を通知して方向固有Apply Lifecycleをidleへ完了させる。 |

### {direction} large reorder cancel {{#RV_{d}_LARGE_REORDER_CANCEL}}

確認中にCancelした場合はTableデータを変更せず、確認UIを終了して方向固有Reorder Applyをidleへ戻す。

| Step | Source | Target | Interaction |
| ---: | --- | --- | --- |
| 1 | EXT_WORDPRESS_EDITOR | {wp_apply_id} | 利用者が確認UIでCancelを選択する。 |
| 2 | {wp_apply_id} | {apply_id} | 確認待ちの移動意図を破棄する。 |
| 3 | {apply_id} | {wp_apply_id} | Tableを変更せずidleへ戻った状態を公開する。 |
| 4 | {wp_apply_id} | EXT_WORDPRESS_EDITOR | 確認UIを終了し、対象Tableの通常編集表示を維持する。 |

### {direction} large reorder revalidation failure {{#RV_{d}_LARGE_REORDER_REVALIDATION_FAILURE}}

Continue後の現在Table再照合で移動が成立しなくなっている場合はTableを変更せず、表示復帰を経てLifecycleを完了する。

| Step | Source | Target | Interaction |
| ---: | --- | --- | --- |
| 1 | {apply_id} | {table_id} | 反映直前の現在{axis}制約を要求する。 |
| 2 | {table_id} | EXT_SUPPORTED_TABLE_BLOCK | 要求時点の対応Tableから現在{axis}制約を取得する。 |
| 3 | {table_id} | {apply_id} | 移動元または移動先が成立しない現在状態を返す。 |
| 4 | {apply_id} | {wp_apply_id} | Tableを更新せずediting surface restorationへ進んだことを公開する。 |
| 5 | {wp_apply_id} | EXT_WORDPRESS_EDITOR | 対象Tableの編集表示を再成立させる。 |
| 6 | {wp_apply_id} | {apply_id} | 表示復帰完了を通知して方向固有Apply Lifecycleをidleへ完了させる。 |

'''
              text = replace_once(text, cancel_heading, large_runtime + cancel_heading, f'{path}: large runtime')

              # Crosscutting concept before atomic update.
              atomic_heading = f'### Atomic {lower} update'
              crosscutting = f'''### Reorder apply routing and lifecycle

Table Integrationが現在構造から算出した更新対象セル数を共通Reorder Apply Policyへ渡し、通常反映と確認付き大規模反映を選択する。PolicyはTable構造や方向固有移動を解釈せず、方向固有Reorder Apply状態も所有しない。

確認付き大規模反映では、物理drag-end処理と確認UIを分離するため、DnD Sessionを終了してから方向固有Reorder Applyが移動意図を受理する。確認中はTableを変更せず、Continue後にも現在構造を再照合する。WordPress Reorder Apply IntegrationはEditor表示接続だけを担当し、Table更新の権威はTable Integrationに維持する。

'''
              text = replace_once(text, atomic_heading, crosscutting + atomic_heading, f'{path}: crosscutting')

              # Architecture decisions.
              decision_heading = '## 9. Architecture Decisions\n\n'
              decisions = (
                  '- Reorder Apply PolicyをRow / Column共通の独立責務とし、更新対象セル数だけから反映経路を選択する。\n'
                  f'- 確認付き大規模反映Lifecycleは{direction} Reorder Applyの方向固有責務とし、Row / Column間で状態を共有しない。\n'
                  '- WordPress Reorder Apply Integrationを通常のWordPress Reorder Integrationから分離し、確認・反映中表示・editing surface restorationだけを接続する。\n'
                  '- 確認付き大規模反映ではDnD Session終了後にconfirmingを公開し、物理drag-end処理と確認UIを分離する。\n'
                  '- Continue後も現在Table構造を再照合し、成立しない場合はTableを変更しない。\n'
              )
              text = replace_once(text, decision_heading, decision_heading + decisions, f'{path}: decisions')

              p.write_text(text, encoding='utf-8')

          update_document(
              'docs/architecture/row-reorder-v1-architecture.md',
              direction='Row', lower='row', axis='行'
          )
          update_document(
              'docs/architecture/column-reorder-v1-architecture.md',
              direction='Column', lower='column', axis='列'
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Generate Structurizr DSL from Markdown
        run: |
          npm run architecture:generate -- docs/architecture/row-reorder-v1-architecture.md
          npm run architecture:generate -- docs/architecture/column-reorder-v1-architecture.md

      - name: Commit architecture update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/row-reorder-v1-architecture.md \
                  docs/architecture/column-reorder-v1-architecture.md \
                  docs/architecture/row-reorder-v1-architecture.dsl \
                  docs/architecture/column-reorder-v1-architecture.dsl
          git commit -m "docs: align reorder apply architecture"
          git push origin HEAD:docs/928-reorder-apply-architecture

      - name: Remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/issue-928-apply-architecture.yml
          git commit -m "chore: remove temporary issue 928 workflow"
          git push origin HEAD:docs/928-reorder-apply-architecture
