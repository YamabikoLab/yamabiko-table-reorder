name: Gitleaks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-doc-paths:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 448
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update flattened documentation references
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'docs/design/table-reorder/': 'docs/design/',
              'docs/plans/table-reorder/': 'docs/plans/',
              'docs/requirements/table-reorder/': 'docs/requirements/',
          }

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          tailored = {
              Path('docs/design/table-reorder-design.md'): {
                  '../../requirements/table-reorder/': '../requirements/',
              },
              Path('docs/design/table-reorder-accessibility-design.md'): {
                  '../../requirements/table-reorder/': '../requirements/',
              },
              Path('docs/design/archive/table-reorder-design.md'): {
                  '../../../requirements/table-reorder/archive/': '../../requirements/archive/',
              },
              Path('docs/design/archive/table-reorder-accessibility-design.md'): {
                  '../../../requirements/table-reorder/archive/': '../../requirements/archive/',
              },
          }

          for path, path_replacements in tailored.items():
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in path_replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Restore workflow and verify references
        run: |
          git show origin/main:.github/workflows/gitleaks.yml > .github/workflows/gitleaks.yml

          if grep -RInE 'docs/(design|plans|requirements)/table-reorder/' . \
            --exclude-dir=.git; then
            echo 'Old table-reorder documentation paths remain.' >&2
            exit 1
          fi

          if grep -RInE 'docs/(design|plans|requirements)/outline/' . \
            --exclude-dir=.git; then
            echo 'Deleted outline documentation paths remain.' >&2
            exit 1
          fi

          if grep -RInE '(\.\./){2,}requirements/table-reorder/' docs/design \
            --include='*.md'; then
            echo 'Old relative requirements paths remain in design docs.' >&2
            exit 1
          fi

      - name: Commit documentation fixes
        run: |
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix flattened docs references'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  gitleaks:
    name: Scan full Git history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all Git refs with Gitleaks
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --log-opts="--all" --redact --exit-code 1 .
