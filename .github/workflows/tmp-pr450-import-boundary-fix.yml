name: Temporary PR 450 import boundary cleanup

on:
  push:
    branches:
      - refactor/449-row-reorder-common
    paths:
      - .github/workflows/tmp-pr450-import-boundary-fix.yml

permissions:
  contents: write

jobs:
  apply-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/449-row-reorder-common

      - name: Apply import boundary cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          replacements = {
              "@/messages": "@/row-reorder/messages",
              "@/table-context": "@/row-reorder/table-context",
              "@/controller/": "@/row-reorder/controller/",
          }

          for path in (root / 'src' / 'row-reorder').rglob('*'):
              if not path.is_file() or path.suffix not in {'.ts', '.tsx'}:
                  continue
              text = path.read_text()
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if path.parent == root / 'src' / 'row-reorder' / 'controller':
                  updated = updated.replace(
                      "'./sortable-runtime-loader'",
                      "'@/common/sortable-runtime-loader'",
                  )
              if updated != text:
                  path.write_text(updated)

          tsconfig = root / 'tsconfig.json'
          text = tsconfig.read_text()
          for line in (
              '\t\t\t"@/messages": [ "./src/row-reorder/messages" ],\n',
              '\t\t\t"@/table-context": [ "./src/row-reorder/table-context" ],\n',
              '\t\t\t"@/controller/*": [ "./src/row-reorder/controller/*" ],\n',
          ):
              text = text.replace(line, '')
          tsconfig.write_text(text)

          jest_config = root / 'jest-unit.config.js'
          text = jest_config.read_text()
          for line in (
              "\t\t'^@/messages$': '<rootDir>/src/row-reorder/messages',\n",
              "\t\t'^@/table-context$': '<rootDir>/src/row-reorder/table-context',\n",
              "\t\t'^@/controller/(.*)$': '<rootDir>/src/row-reorder/controller/$1',\n",
          ):
              text = text.replace(line, '')
          jest_config.write_text(text)

          webpack = root / 'webpack.config.js'
          text = webpack.read_text()
          for line in (
              "\t\t\t'@/messages$': path.resolve( __dirname, 'src/row-reorder/messages' ),\n",
              "\t\t\t'@/table-context$': path.resolve( __dirname, 'src/row-reorder/table-context' ),\n",
              "\t\t\t'@/controller': path.resolve( __dirname, 'src/row-reorder/controller' ),\n",
          ):
              text = text.replace(line, '')
          webpack.write_text(text)

          facade = root / 'src/row-reorder/controller/sortable-runtime-loader.ts'
          facade.unlink(missing_ok=True)

          workflow = root / '.github/workflows/tmp-pr450-import-boundary-fix.yml'
          workflow.unlink(missing_ok=True)
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor: expose row reorder import boundaries"
          git push origin HEAD:refactor/449-row-reorder-common
